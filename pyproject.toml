[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeos"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "sqlalchemy==2.0.40",
    "alembic==1.15.2",
    "argon2-cffi==23.1.0",
    "PyJWT==2.10.1",
    "tsidpy==1.1.5",
    "pydantic==2.11.3",
    "email-validator==2.2.0",
]

[project.optional-dependencies]
test = [
    "httpx==0.28.1",
    "pytest==8.3.5",
    "pytest-archon==0.0.7",
    "pytest-cov==6.1.1",
]

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["app"]
include = ["*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
